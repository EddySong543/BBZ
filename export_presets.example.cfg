; ============================================================================
; 发行导出预设·脱敏模板（2026-07-17 发行审计①·docs/pck-encryption-guide.md「导出配置可复现性」约定落地）
; 用法：复制本文件为 export_presets.cfg（真文件持续被 .gitignore 忽略=密钥永不入仓）→
;       Godot 编辑器打开会识别预设 → 按下方 TODO 补密钥/签名 → 导出。
; 排除规则=发行白名单思路：非运行时目录全排除（外部审计副本已用同规则验证导出可运行·
;       包内探针确认 tools/tests/gut/prototypes/production/font/ref/res 均不存在）。
; ⚠ 修改导出参数后必须同步回本 example（剥掉密钥）——review 时 diff 一眼可见。
; ============================================================================

[preset.0]

name="Windows 发行"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 排除（发行审计②④⑦）：调试面板/开发管线/测试/GUT/原型/生产文档/源资料区/参考图/
; 设计与技术文档/导入暂存与源档/i18n 键表（未激活翻译）/编辑器元数据/所有 markdown
exclude_filter="src/ui/debug/*,tools/*,tests/*,addons/gut/*,prototypes/*,production/*,font/*,ref/*,res/*,design/*,docs/*,assets/import/*,assets/art_src/*,assets/i18n/*,.ghlp-metadata.json,*.md,.gutconfig.json"
; 强制打包非资源文件（发行审计⑤）：字体 OFL 许可证必须随发行物分发
include_filter="assets/font/*.txt,THIRD-PARTY-NOTICES.md"
export_path="build/BoBoZan.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
; TODO（发布期·docs/pck-encryption-guide.md）：PCK 加密三开关——需先编译带 AES 密钥的
; 自定义模板（密钥存密码管理器·⛔永不写进本仓库任何文件）：
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
; TODO（发布期）：指向带密钥自编译的 release 模板（见加密指南 §2）
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
; TODO（发布期）：Authenticode 签名（SmartScreen 信任·需代码签名证书·涉费用 Eddy 定）
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
; 发行元数据（发行审计⑥·崩溃报告识别/版本追踪）——版本号与 project.godot 同步改
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="EddySong543"
application/product_name="波波攒"
application/file_description="波波攒 BoBoZan"
application/copyright="Copyright (c) 2026 EddySong543"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
