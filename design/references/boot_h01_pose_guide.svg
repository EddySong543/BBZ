<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1792" viewBox="0 0 1024 1792">
  <rect width="1024" height="1792" fill="#d8d8d8"/>

  <!-- Head and front-facing torso -->
  <ellipse cx="512" cy="276" rx="112" ry="132" fill="#282832"/>
  <path d="M344 420 Q512 354 680 420 L774 1588 Q512 1682 250 1588 Z" fill="#383842"/>

  <!-- Legs: equal size, straight-on stance -->
  <path d="M368 1500 L493 1500 L469 1760 L305 1760 Z" fill="#30303a"/>
  <path d="M531 1500 L656 1500 L719 1760 L555 1760 Z" fill="#30303a"/>

  <!-- Upper arm curves inward to the top palm -->
  <path d="M354 514 C208 550 190 654 270 724 C322 768 390 726 440 660"
        fill="none" stroke="#30303a" stroke-width="104" stroke-linecap="round"/>

  <!-- Lower arm curves inward to the bottom palm -->
  <path d="M670 520 C832 622 838 850 724 986 C670 1050 610 1018 566 956"
        fill="none" stroke="#30303a" stroke-width="104" stroke-linecap="round"/>

  <!-- Exact horizontal upper and lower hands -->
  <rect x="350" y="574" width="324" height="86" rx="43" fill="#7b7b86"/>
  <rect x="350" y="900" width="324" height="86" rx="43" fill="#7b7b86"/>

  <!-- Empty chest-level sphere gap: guide only, not part of final art -->
  <circle cx="512" cy="780" r="118" fill="none" stroke="#a77922" stroke-width="12"
          stroke-dasharray="28 22" opacity="0.78"/>

  <!-- Vertical alignment guide -->
  <path d="M512 506 L512 1054" fill="none" stroke="#8c3a3a" stroke-width="8"
        stroke-dasharray="18 20" opacity="0.48"/>
</svg>
